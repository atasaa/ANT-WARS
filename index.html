
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="theme-color" content="#10170e">
        <title>ANT WARS</title>

          <style>
              * { box-sizing: border-box; }

                  body {
                        margin: 0;
                              min-height: 100vh;
                                    font-family: Arial, sans-serif;
                                          color: #f4f1df;
                                                background:
                                                        radial-gradient(ellipse at top, #40572d, transparent 60%),
                                                                #0b1009;
                                                                      display: grid;
                                                                            place-items: center;
                                                                                  padding: 20px;
                                                                                      }

                                                                                          main {
                                                                                                width: min(750px, 100%);
                                                                                                      padding: 55px 25px;
                                                                                                            text-align: center;
                                                                                                                  background: #151e12;
                                                                                                                        border: 1px solid #617447;
                                                                                                                              border-radius: 22px;
                                                                                                                                    box-shadow: 0 20px 70px #0009;
                                                                                                                                        }

                                                                                                                                            .ant { font-size: 85px; }

                                                                                                                                                h1 {
                                                                                                                                                      font-size: clamp(40px, 10vw, 68px);
                                                                                                                                                            letter-spacing: 10px;
                                                                                                                                                                  color: #e5d79a;
                                                                                                                                                                        margin: 15px 0;
                                                                                                                                                                            }

                                                                                                                                                                                p {
                                                                                                                                                                                      max-width: 560px;
                                                                                                                                                                                            margin: 20px auto;
                                                                                                                                                                                                  line-height: 1.8;
                                                                                                                                                                                                        color: #c5cbb9;
                                                                                                                                                                                                              font-size: 17px;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      .status {
                                                                                                                                                                                                                            display: inline-block;
                                                                                                                                                                                                                                  padding: 12px 20px;
                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                              border: 1px solid #91a65c;
                                                                                                                                                                                                                                                    border-radius: 30px;
                                                                                                                                                                                                                                                          color: #dceba9;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  .features {
                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                              justify-content: center;
                                                                                                                                                                                                                                                                                    flex-wrap: wrap;
                                                                                                                                                                                                                                                                                          gap: 10px;
                                                                                                                                                                                                                                                                                                margin-top: 30px;
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                        .features span {
                                                                                                                                                                                                                                                                                                              padding: 10px 14px;
                                                                                                                                                                                                                                                                                                                    border: 1px solid #526341;
                                                                                                                                                                                                                                                                                                                          border-radius: 25px;
                                                                                                                                                                                                                                                                                                                                font-size: 13px;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                        footer {
                                                                                                                                                                                                                                                                                                                                              margin-top: 40px;
                                                                                                                                                                                                                                                                                                                                                    color: #89947d;
                                                                                                                                                                                                                                                                                                                                                          font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                <body>
                                                                                                                                                                                                                                                                                                                                                                  <main>
                                                                                                                                                                                                                                                                                                                                                                      <div class="ant">🐜</div>

                                                                                                                                                                                                                                                                                                                                                                          <h1>ANT WARS</h1>

                                                                                                                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                                                                                                                    A massive world beneath your feet.
                                                                                                                                                                                                                                                                                                                                                                                          Begin as a lone soldier ant, find a mate,
                                                                                                                                                                                                                                                                                                                                                                                                establish your colony and build an empire.
                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                        <div class="status">
                                                                                                                                                                                                                                                                                                                                                                                                              GAME PROJECT ONLINE
                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="features">
                                                                                                                                                                                                                                                                                                                                                                                                                            <span>First-person ant survival</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                  <span>Colony building</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Open world</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                              <span>Online multiplayer</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>Offline gameplay</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ANT WARS — Development begins
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
